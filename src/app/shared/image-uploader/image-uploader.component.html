
<input type="file" class="file-input" (change)="onFileSelected($event)"
  #fileUpload>

<div class="upload">

  <div class="file-upload">
    <span class="filename">
      {{filename || "Click to upload image."}}
    </span>
    <button mat-raised-button color="primary" class="upload-btn"
      (click)="fileUpload.click(); false">
      <mat-icon>attach_file</mat-icon>
      Upload image
    </button>
  </div>

  @if (status !== 'idle') {
    <div class="progress">
      <span class="progress-label">{{status}}</span>
      <mat-progress-bar class="progress-bar" [mode]="mode"
        [value]="progress">
      </mat-progress-bar>
      @if (progress) {
        <mat-icon class="cancel-upload" (click)="cancelUpload()"
        >delete_forever</mat-icon>
      }
    </div>
  }

  <div class="status">
    @if (uploaded) {
      <div>
        <div>Image has been uploaded.</div>
      </div>
    } @else {
    }
  </div>

</div>
