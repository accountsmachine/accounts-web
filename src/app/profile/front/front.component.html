
<div class="container">

  @if (login_state || registering_state || forgotten_password_state) {
    <div>
      <img src="/assets/accountsmachine.png" alt="Accounts Machine logo">
    </div>
  }

  @if (login_state) {
    <div>
      <login></login>
    </div>
  }

  @if (registering_state) {
    <div>
      <register></register>
    </div>
  }

  @if (forgotten_password_state) {
    <div>
      <reset-password></reset-password>
    </div>
  }

  @if (verifying_email_state) {
    <div>
      <verify-email></verify-email>
    </div>
  }

  @if (loading_state) {
    <div id="loading">
      <div>Loading...</div>
      <img src="/assets/accountsmachine.png" alt="Accounts Machine logo">
    </div>
  }

</div>
